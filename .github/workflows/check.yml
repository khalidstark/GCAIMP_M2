name: Check pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sql-check:
    name: sql-check
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Gcaimp_CI_2026!"
    steps:
      - uses: actions/checkout@v4

      - name: Glue procedures/*.sql and executions/*.sql (same as main)
        run: |
          glue () {
            dir="$1"; out="$2"
            printf 'USE GCAIMP;\nGO\n' > "$out"
            [ -d "$dir" ] || return 0
            files=""
            for n in Khalid Lamar Jomana Abdallah Rawan; do
              [ -f "$dir/$n.sql" ] && files="$files $dir/$n.sql"
            done
            for f in $(ls "$dir"/*.sql 2>/dev/null | sort); do
              case " $files " in *" $f "*) ;; *) files="$files $f" ;; esac
            done
            for f in $files; do
              printf '\n' >> "$out"
              cat "$f" >> "$out"
              printf '\nGO\n' >> "$out"
            done
          }
          glue procedures Procedures.sql
          glue executions Executions.sql

      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs sql; exit 1

      - name: Run Tables, Insertions, Procedures, Executions
        run: |
          docker cp . sql:/tmp/work
          for f in Tables.sql Insertions.sql Procedures.sql Executions.sql; do
            echo "::group::$f"
            if ! docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -I -b -i "/tmp/work/$f"; then
              echo "::endgroup::"
              echo "::error file=$f::$f has an error. Fix it on your branch and push again; the PR cannot be merged until this check is green."
              exit 1
            fi
            echo "::endgroup::"
          done
